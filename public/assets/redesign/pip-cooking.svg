<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" style="width: 100%; display: block" aria-label="Pip cooking a meal"><style>
svg { --sp: 1; --pip-body:#2B7BE0; --pip-body2:#1B5CB4; --pip-belly:#FFF4E4; --pip-accent:#FF9500; --pip-accent2:#DD7B00; --pip-eye:#0B2149; }
@keyframes pipBreathe { 0%,100% { transform: scale(1,1) } 50% { transform: scale(1.035,.965) } }
@keyframes pipBob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
@keyframes pipBlink { 0%,90%,100% { transform: scaleY(1) } 95% { transform: scaleY(.08) } }
@keyframes pipShadowSoft { 0%,100% { transform: scaleX(1); opacity: .11 } 50% { transform: scaleX(.95); opacity: .09 } }
@keyframes pipStirWing { 0% { transform: rotate(-45deg) } 100% { transform: rotate(-37deg) } }
@keyframes pipStir { 0% { transform: rotate(-3deg) } 100% { transform: rotate(5deg) } }
@keyframes pipSteam { 0% { opacity:0; transform:translateY(6px) scale(.55) } 22% { opacity:.7 } 100% { opacity:0; transform:translateY(-40px) scale(1.3) } }
@keyframes pipBubble { 0% { opacity:0; transform:translateY(3px) scale(.3) } 40% { opacity:.95 } 100% { opacity:0; transform:translateY(-5px) scale(1.15) } }
@keyframes pipHatWobble { 0% { transform:rotate(-16deg) } 100% { transform:rotate(-12deg) } }
@keyframes pipCrest { 0% { transform:rotate(58deg) } 100% { transform:rotate(65deg) } }
@keyframes pipBob { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-5px) } }
@media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; animation-delay: 0s !important; } }
</style>
