<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | GoodhealthMate</title>
    <style>
      :root {
        color-scheme: light;
        --primary: #007bff;
        --text: #0b1120;
        --muted: #667085;
        --border: #d1d5db;
        --surface: #ffffff;
        --page: #f6f9fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--page);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(100%, 760px);
        margin: 0 auto;
        padding: 48px 20px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 32px;
        color: var(--primary);
        font-size: 20px;
        font-weight: 800;
        text-decoration: none;
      }

      .mark {
        display: inline-grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 10px;
        background: var(--primary);
        color: #ffffff;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 32px;
        box-shadow: 0 18px 50px rgb(15 23 42 / 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(32px, 7vw, 48px);
        line-height: 1.1;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 18px;
      }

      a {
        color: var(--primary);
        font-weight: 700;
      }

      form {
        display: grid;
        gap: 18px;
        margin-top: 28px;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--text);
        font-size: 14px;
        font-weight: 700;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        font: inherit;
      }

      textarea {
        min-height: 140px;
        resize: vertical;
      }

      button {
        justify-self: start;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        padding: 13px 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">
        <span class="mark">G</span>
        <span>GoodhealthMate</span>
      </a>

      <section class="panel" aria-labelledby="contact-title">
        <h1 id="contact-title">Contact Us</h1>
        <p>
          Need help or want to share ideas? Reach us directly at
          <a href="mailto:support@dreamingstudio.net">support@dreamingstudio.net</a>.
        </p>
        <p>You can also send feedback below and attach screenshots or photos.</p>

        <form action="https://formsubmit.co/support@dreamingstudio.net" method="POST" enctype="multipart/form-data">
          <input type="hidden" name="_subject" value="GoodhealthMate Website Feedback" />
          <input type="hidden" name="_captcha" value="false" />
          <input type="hidden" name="_template" value="table" />

          <label>
            Name
            <input name="name" type="text" required placeholder="Your name" />
          </label>

          <label>
            Email
            <input name="email" type="email" required placeholder="you@example.com" />
          </label>

          <label>
            Feedback
            <textarea name="feedback_message" required placeholder="Share your feedback..."></textarea>
          </label>

          <label>
            Attach Images (optional)
            <input name="attachment" type="file" accept="image/*" multiple />
          </label>

          <button type="submit">Send Feedback</button>
        </form>
      </section>
    </main>
  </body>
</html>
